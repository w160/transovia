<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Варианты сайта</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1e2f 0%, #2b2b45 50%, #1a1a2e 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 40px 20px;
  }

  h1 {
    color: #fff;
    font-size: 2.4rem;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 40px;
    text-align: center;
    background: linear-gradient(90deg, #7f5af0, #2cb67d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 820px;
  }

  a {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px 18px;
    color: #fff;
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    backdrop-filter: blur(8px);
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  a::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #7f5af0, #2cb67d);
    opacity: 0;
    transition: opacity 0.25s ease;
    z-index: -1;
  }

  a:hover {
    transform: translateY(-3px);
    border-color: transparent;
    box-shadow: 0 10px 30px rgba(127, 90, 240, 0.35);
  }

  a:hover::before { opacity: 1; }

  a:active { transform: translateY(-1px); }
</style>
</head>
<body>
  <h1>Варианты сайта</h1>
  <div class="grid">
    <a href="v1.html" target="_blank" rel="noopener">Вариант 1</a>
    <a href="v2.html" target="_blank" rel="noopener">Вариант 2</a>
    <a href="v3.html" target="_blank" rel="noopener">Вариант 3</a>
    <a href="v4.html" target="_blank" rel="noopener">Вариант 4</a>
    <a href="v5.html" target="_blank" rel="noopener">Вариант 5</a>
    <a href="v6.html" target="_blank" rel="noopener">Вариант 6</a>
    <a href="v7.html" target="_blank" rel="noopener">Вариант 7</a>
    <a href="v8.html" target="_blank" rel="noopener">Вариант 8</a>
    <a href="v9.html" target="_blank" rel="noopener">Вариант 9</a>
    <a href="v10.html" target="_blank" rel="noopener">Вариант 10</a>
  </div>
</body>
</html>
